@if (!(isInitialized$ | async)) {
  <app-loading-screen/><app-loading-screen/>
}

@if (isInitialized$ | async) {
  @if (hideLayout$ | async) {
    <!-- Layout sin header ni footer para páginas como 404 -->
    <div class="full-page-container">
      <div
        [@routeAnimations]="getRouteAnimationData(outlet)"
        class="w-full h-screen"
      >
        <router-outlet #outlet="outlet"></router-outlet>
      </div>
    </div>
  } @else if (hideFooter$ | async) {
    <!-- Layout sin footer pero con header -->
    <div class="app-container">
      <app-header></app-header>
      <div class="flex flex-col h-screen pt-[60px]">
        <div
          [@routeAnimations]="getRouteAnimationData(outlet)"
          class="flex-1 relative w-full"
        >
          <router-outlet #outlet="outlet"></router-outlet>
        </div>
        <!-- Sin footer aquí -->
      </div>
    </div>
  } @else {
    <!-- Layout normal con header y footer -->
    <div class="app-container">
      <app-header></app-header>
      <div class="flex flex-col h-screen pt-[60px]">
        <div
          [@routeAnimations]="getRouteAnimationData(outlet)"
          class="flex-1 relative w-full"
        >
          <router-outlet #outlet="outlet"></router-outlet>
        </div>
        <app-footer></app-footer>
      </div>
    </div>
  }
}
