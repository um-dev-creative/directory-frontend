<header class="tw-sticky tw-top-0 tw-z-40 tw-flex tw-items-center tw-justify-between tw-bg-white/60 tw-px-4 tw-py-3 tw-shadow-md tw-backdrop-blur-sm tw-border-b tw-border-slate-200">
  <!-- Logo -->
  <div class="logo">
    <img src="/assets/images/latin_hub_logo_v1.svg" alt="Latin Hub Logo">
  </div>
  <!-- Search component -->
  <div class="tw-w-[35%]">
    <app-search></app-search>
  </div>
  <!-- Menú de acciones -->
  <div class="tw-flex tw-items-center tw-gap-4">
    <!-- Botón de  -->
    <button mat-flat-button class="tw-shadow-lg tw-shadow-indigo-500/40 tw-hidden md:tw-inline-block tw-bg-blue-500 tw-text-white tw-rounded-md tw-px-4 tw-py-2 hover:tw-bg-blue-600" (click)="logout()">
      {{ 'menu_header.signing_button.title' | translate }}
    </button>

    <!-- Menú hamburguesa -->
    <button
      class="tw-flex tw-items-center tw-justify-center tw-bg-gray-100 tw-rounded-full tw-p-2 hover:tw-bg-gray-200"
      (click)="toggleMobileMenu(true)"
    >
      <svg
        class="tw-w-6 tw-h-6 tw-text-gray-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
    <!-- Botón de usuario -->
    <app-menu
      [isProfileMenuOpen]="isProfileMenuOpen"
      [isSupportMenuOpen]="isSupportMenuOpen"
      (logoutClicked)="logout()"
    ></app-menu>
  </div>
</header>
