<!-- Loading state -->
@if (loading$ | async) {
  <app-skeleton variant="custom">
    <div class="skeleton-element skeleton-shimmer skeleton-rounded w-full
                h-[150px] md:h-[90px] lg:h-[100px]"></div>
  </app-skeleton>
}

<!-- Error state -->
@if (error$ | async; as errorMessage) {
  <div class="flex justify-center items-center py-8" role="alert" aria-live="polite">
    <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-700">
      <p class="text-sm">{{ errorMessage }}</p>
    </div>
  </div>
}

<!-- Banner section -->
@if (currentBanner && !(loading$ | async) && !(error$ | async)) {
  @switch (bannerType) {
    @case ('top') {
      <section class="flex justify-center rounded-[15px]" role="banner" aria-label="Promotional banner">
        <a
          [routerLink]="getRouteForBanner()"
          class="clickable-pointer block focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded-lg"
          [attr.aria-label]="'Navigate to ' + currentBanner.alt"
          role="link"
        >
          <picture>
            <source
              media="(min-width: 1024px)"
              [srcset]="imageBucketUrl+currentBanner.desktop"
            >
            <source
              media="(min-width: 768px)"
              [srcset]="imageBucketUrl+currentBanner.tablet"
            >
            <img
              [src]="imageBucketUrl+currentBanner.mobile"
              [alt]="currentBanner.alt"
              class="rounded-lg shadow-md w-full h-auto"
              loading="lazy"
              (error)="onImageError($event)"
            >
          </picture>
        </a>
      </section>
    }
    @case ('mid') {
      <section
        class="flex justify-center items-center rounded-[5px] overflow-visible w-full h-full"
        role="banner"
        aria-label="Secondary promotional banner"
      >
        <a
          [routerLink]="getRouteForBanner()"
          class="clickable-pointer relative w-full h-full block focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded-lg transition-transform duration-300 hover:scale-110"
          [attr.aria-label]="'Navigate to ' + currentBanner.alt"
          role="link"
        >
          <picture>
            <source
              media="(min-width: 1024px)"
              [srcset]="imageBucketUrl+currentBanner.desktop"
            >
            <source
              media="(min-width: 768px)"
              [srcset]="imageBucketUrl+currentBanner.tablet"
            >
            <img
              [src]="imageBucketUrl+currentBanner.mobile"
              [alt]="currentBanner.alt"
              class="w-full rounded-lg shadow-md h-auto"
              loading="lazy"
              (error)="onImageError($event)"
            >
          </picture>
        </a>
      </section>
    }
  }
}
