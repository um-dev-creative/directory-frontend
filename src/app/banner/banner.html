<!-- Loading state -->
@if (loading$ | async) {
  <div class="tw-flex tw-justify-center tw-items-center tw-py-8" role="status" aria-label="Loading banner">
    <div class="tw-animate-pulse tw-bg-gray-200 tw-rounded-lg tw-h-32 tw-w-full tw-max-w-md"></div>
    <span class="tw-sr-only">Loading banner content...</span>
  </div>
}

<!-- Error state -->
@if (error$ | async; as errorMessage) {
  <div class="tw-flex tw-justify-center tw-items-center tw-py-8" role="alert" aria-live="polite">
    <div class="tw-bg-red-50 tw-border tw-border-red-200 tw-rounded-lg tw-p-4 tw-text-red-700">
      <p class="tw-text-sm">{{ errorMessage }}</p>
    </div>
  </div>
}

<!-- Banner section -->
@if (currentBanner && !(loading$ | async) && !(error$ | async)) {
  @switch (bannerType) {
    @case ('top') {
      <section class="tw-flex tw-justify-center tw-rounded-[15px]" role="banner" aria-label="Promotional banner">
        <a
          [routerLink]="getRouteForBanner()"
          class="clickable-pointer tw-block tw-focus:tw-outline-none tw-focus:tw-ring-2 tw-focus:tw-ring-blue-500 tw-focus:tw-ring-offset-2 tw-rounded-lg"
          [attr.aria-label]="'Navigate to ' + currentBanner.alt"
          role="link"
        >
          <picture>
            <source
              media="(min-width: 1024px)"
              [srcset]="imageBucketUrl+currentBanner.desktop"
            >
            <source
              media="(min-width: 768px)"
              [srcset]="imageBucketUrl+currentBanner.tablet"
            >
            <img
              [src]="imageBucketUrl+currentBanner.mobile"
              [alt]="currentBanner.alt"
              class="tw-rounded-lg tw-shadow-md tw-w-full tw-h-auto"
              loading="lazy"
              (error)="onImageError($event)"
            >
          </picture>
        </a>
      </section>
    }
    @case ('mid') {
      <section
        class="tw-flex tw-justify-center tw-items-center tw-rounded-[5px] tw-overflow-visible tw-w-full tw-h-full"
        role="banner"
        aria-label="Secondary promotional banner"
      >
        <a
          [routerLink]="getRouteForBanner()"
          class="clickable-pointer tw-relative tw-w-full tw-h-full tw-block tw-focus:tw-outline-none tw-focus:tw-ring-2 tw-focus:tw-ring-blue-500 tw-focus:tw-ring-offset-2 tw-rounded-lg tw-transition-transform tw-duration-300 hover:tw-scale-110"
          [attr.aria-label]="'Navigate to ' + currentBanner.alt"
          role="link"
        >
          <picture>
            <source
              media="(min-width: 1024px)"
              [srcset]="imageBucketUrl+currentBanner.desktop"
            >
            <source
              media="(min-width: 768px)"
              [srcset]="imageBucketUrl+currentBanner.tablet"
            >
            <img
              [src]="imageBucketUrl+currentBanner.mobile"
              [alt]="currentBanner.alt"
              class="tw-w-full tw-rounded-lg tw-shadow-md tw-h-auto"
              loading="lazy"
              (error)="onImageError($event)"
            >
          </picture>
        </a>
      </section>
    }
  }
}
