<!-- Componente de búsqueda con estilos de marca latinhub -->
<div [class]="containerClasses" (click)="focusInput()">
  <!-- Icon: Search -->
  <svg
    class="tw-w-6 tw-h-6 tw-text-emerald-green-600 tw-ml-2 tw-flex-shrink-0"
    [class.tw-text-emerald-green-400]="disabled"
    [class.tw-animate-pulse]="loading"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="1.5"
    stroke="currentColor"
    aria-hidden="true"
  >
    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
  </svg>

  <!-- Input -->
  <input
    #searchInput
    type="text"
    [(ngModel)]="searchText"
    (input)="onInput()"
    (keypress)="onKeyPress($event)"
    [disabled]="disabled"
    [maxlength]="maxLength"
    [placeholder]="placeholder | translate"
    [attr.aria-label]="'menu_header.search.aria_label' | translate"
    class="tw-flex-grow tw-bg-transparent tw-border-none tw-outline-none tw-pl-4 tw-text-emerald-green-800 tw-placeholder-beige-600 focus:tw-ring-0 focus:tw-border-transparent tw-font-medium"
    [class.tw-cursor-not-allowed]="disabled"
    [class.tw-text-emerald-green-400]="disabled"
    autocomplete="off"
    spellcheck="false"
  />

  <!-- Loading indicator -->
  @if (loading && !searchText) {
    <div class="tw-flex tw-items-center tw-justify-center tw-mr-3">
      <svg
        class="tw-animate-spin tw-h-4 tw-w-4 tw-text-emerald-green-500"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="tw-opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="tw-opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
    </div>
  }

  <!-- Submit Button (when text is valid) -->
  @if (searchText && isSearchValid && !loading) {
    <button
      (click)="onSubmit()"
      [disabled]="disabled || !isSearchValid"
      class="tw-flex tw-items-center tw-justify-center tw-bg-emerald-green-500 tw-rounded-full tw-p-2 hover:tw-bg-emerald-green-600 tw-transition-all tw-duration-200 tw-mr-1 tw-shadow-sm disabled:tw-opacity-50 disabled:tw-cursor-not-allowed"
      [attr.aria-label]="'menu_header.search.submit' | translate"
      title="{{ 'menu_header.search.submit' | translate }}"
    >
      <svg
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.5"
        stroke="currentColor"
        class="tw-w-3 tw-h-3 tw-text-white"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>
    </button>
  }

  <!-- Clear Button (X) -->
  @if (searchText && !loading) {
    <button
      (click)="clearSearch()"
      [disabled]="disabled"
      class="tw-flex tw-items-center tw-justify-center tw-bg-coral-500 tw-rounded-full tw-p-2 hover:tw-bg-coral-600 tw-transition-all tw-duration-200 tw-mr-1 tw-shadow-sm disabled:tw-opacity-50 disabled:tw-cursor-not-allowed"
      [attr.aria-label]="'menu_header.search.clear' | translate"
      title="{{ 'menu_header.search.clear' | translate }}"
    >
      <svg
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.5"
        stroke="currentColor"
        class="tw-w-3 tw-h-3 tw-text-white"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  }
</div>
