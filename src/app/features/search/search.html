<!-- Componente de búsqueda con estilos de marca latinhub -->
<div [class]="containerClasses" (click)="focusInput()">
  <!-- Icon: Search -->
  <svg
    class="w-6 h-6 text-emerald-green-600 ml-2 shrink-0"
    [class.text-emerald-green-400]="disabled"
    [class.animate-pulse]="loading"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="1.5"
    stroke="currentColor"
    aria-hidden="true"
  >
    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
  </svg>

  <!-- Input -->
  <input
    #searchInput
    type="text"
    [(ngModel)]="searchText"
    (input)="onInput()"
    (keypress)="onKeyPress($event)"
    [disabled]="disabled"
    [maxlength]="maxLength"
    [placeholder]="placeholder | translate"
    [attr.aria-label]="'menu_header.search.aria_label' | translate"
    class="grow bg-transparent border-none outline-hidden pl-4 text-emerald-green-800 placeholder:text-beige-600 focus:ring-0 focus:border-transparent font-medium"
    [class.cursor-not-allowed]="disabled"
    [class.text-emerald-green-400]="disabled"
    autocomplete="off"
    spellcheck="false"
  />

  <!-- Loading indicator -->
  @if (loading && !searchText) {
    <div class="flex items-center justify-center mr-3">
      <svg
        class="animate-spin h-4 w-4 text-emerald-green-500"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
    </div>
  }

  <!-- Submit Button (when text is valid) -->
  @if (searchText && isSearchValid && !loading) {
    <button
      (click)="onSubmit()"
      [disabled]="disabled || !isSearchValid"
      class="flex items-center justify-center bg-emerald-green-500 rounded-full p-2 hover:bg-emerald-green-600 transition-all duration-200 mr-1 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
      [attr.aria-label]="'menu_header.search.submit' | translate"
      title="{{ 'menu_header.search.submit' | translate }}"
    >
      <svg
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.5"
        stroke="currentColor"
        class="w-3 h-3 text-white"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>
    </button>
  }

  <!-- Clear Button (X) -->
  @if (searchText && !loading) {
    <button
      (click)="clearSearch()"
      [disabled]="disabled"
      class="flex items-center justify-center bg-coral-500 rounded-full p-2 hover:bg-coral-600 transition-all duration-200 mr-1 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
      [attr.aria-label]="'menu_header.search.clear' | translate"
      title="{{ 'menu_header.search.clear' | translate }}"
    >
      <svg
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.5"
        stroke="currentColor"
        class="w-3 h-3 text-white"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  }
</div>
