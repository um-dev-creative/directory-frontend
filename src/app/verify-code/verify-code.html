<div class="tw-isolate tw-bg-white tw-px-6">
  <div class="tw-mx-auto tw-mt-16 tw-max-w-md sm:tw-mtcf-10">
    <div class="tw-text-center">
      <h2 class="tw-text-xl tw-font-semibold tw-text-gray-900">
        Introduzca el codigo de verificacion
      </h2>
    </div>
    <div class="tw-space-y-4 tw-pt-6">
      <form id="verification-form" class="tw-flex tw-justify-center" [formGroup]="verificationCodeForm">
        <input
          class="tw-block tw-w-full tw-h-[42px] tw-rounded-md tw-bg-white tw-px-3.5 tw-text-gray-900 tw-placeholder-gray-400 tw-text-base tw-border tw-border-gray-300 hover:tw-border-gray-400 focus:tw-border-indigo-600 focus:tw-ring-1 focus:tw-ring-indigo-600 focus:tw-outline-none"
          type="text" maxlength="1" formControlName="position1" required>
        <input
          class="tw-block tw-w-full tw-h-[42px] tw-rounded-md tw-bg-white tw-px-3.5 tw-text-gray-900 tw-placeholder-gray-400 tw-text-base tw-border tw-border-gray-300 hover:tw-border-gray-400 focus:tw-border-indigo-600 focus:tw-ring-1 focus:tw-ring-indigo-600 focus:tw-outline-none"
          type="text" maxlength="1" formControlName="position2" required>
        <input
          class="tw-block tw-w-full tw-h-[42px] tw-rounded-md tw-bg-white tw-px-3.5 tw-text-gray-900 tw-placeholder-gray-400 tw-text-base tw-border tw-border-gray-300 hover:tw-border-gray-400 focus:tw-border-indigo-600 focus:tw-ring-1 focus:tw-ring-indigo-600 focus:tw-outline-none"
          type="text" maxlength="1" formControlName="position3" required>
        <input
          class="tw-block tw-w-full tw-h-[42px] tw-rounded-md tw-bg-white tw-px-3.5 tw-text-gray-900 tw-placeholder-gray-400 tw-text-base tw-border tw-border-gray-300 hover:tw-border-gray-400 focus:tw-border-indigo-600 focus:tw-ring-1 focus:tw-ring-indigo-600 focus:tw-outline-none"
          type="text" maxlength="1" formControlName="position4" required>
        <span class="tw-text-2xl tw-mx-2">-</span>
        <input
          class="tw-block tw-w-full tw-h-[42px] tw-rounded-md tw-bg-white tw-px-3.5 tw-text-gray-900 tw-placeholder-gray-400 tw-text-base tw-border tw-border-gray-300 hover:tw-border-gray-400 focus:tw-border-indigo-600 focus:tw-ring-1 focus:tw-ring-indigo-600 focus:tw-outline-none"
          type="text" maxlength="1" formControlName="position5" required>
        <input
          class="tw-block tw-w-full tw-h-[42px] tw-rounded-md tw-bg-white tw-px-3.5 tw-text-gray-900 tw-placeholder-gray-400 tw-text-base tw-border tw-border-gray-300 hover:tw-border-gray-400 focus:tw-border-indigo-600 focus:tw-ring-1 focus:tw-ring-indigo-600 focus:tw-outline-none"
          type="text" maxlength="1" formControlName="position6" required>
        <input
          class="tw-block tw-w-full tw-h-[42px] tw-rounded-md tw-bg-white tw-px-3.5 tw-text-gray-900 tw-placeholder-gray-400 tw-text-base tw-border tw-border-gray-300 hover:tw-border-gray-400 focus:tw-border-indigo-600 focus:tw-ring-1 focus:tw-ring-indigo-600 focus:tw-outline-none"
          type="text" maxlength="1" formControlName="position7" required>
        <input
          class="tw-block tw-w-full tw-h-[42px] tw-rounded-md tw-bg-white tw-px-3.5 tw-text-gray-900 tw-placeholder-gray-400 tw-text-base tw-border tw-border-gray-300 hover:tw-border-gray-400 focus:tw-border-indigo-600 focus:tw-ring-1 focus:tw-ring-indigo-600 focus:tw-outline-none"
          type="text" maxlength="1" formControlName="position8" required>
      </form>
      <button
        type="submit" form="verification-form"
        class="
        tw-font-bold
        tw-h-10
        tw-text-sm
        md:tw-inline-block
        tw-shadow-lg
        tw-shadow-indigo-500/40
        tw-hidden
        tw-bg-blue-500
        tw-text-white
        tw-rounded-full
        tw-px-4
        tw-py-2
        tw-whitespace-nowrap
        tw-min-w-[100px]
        hover:tw-bg-blue-600"
        (click)="confirmVerificationCode()"
      >Validar
      </button>
    </div>
  </div>
</div>
