<div class="isolate bg-white px-6">
  <div class="mx-auto mt-16 max-w-md sm:mtcf-10">
    <div class="text-center">
      <h2 class="text-xl font-semibold text-gray-900">
        Introduzca el codigo de verificacion
      </h2>
    </div>
    <div class="space-y-4 pt-6">
      <form id="verification-form" class="flex justify-center gap-1" [formGroup]="verificationCodeForm" (paste)="onPaste($event)">
        <input #input1
          class="block w-10 h-[42px] rounded-md bg-white text-center text-gray-900 text-base border border-gray-300 hover:border-gray-400 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-hidden"
          type="text" maxlength="1" formControlName="position1" required
          (input)="onInput($event, input2)">
        <input #input2
          class="block w-10 h-[42px] rounded-md bg-white text-center text-gray-900 text-base border border-gray-300 hover:border-gray-400 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-hidden"
          type="text" maxlength="1" formControlName="position2" required
          (input)="onInput($event, input3)">
        <input #input3
          class="block w-10 h-[42px] rounded-md bg-white text-center text-gray-900 text-base border border-gray-300 hover:border-gray-400 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-hidden"
          type="text" maxlength="1" formControlName="position3" required
          (input)="onInput($event, input4)">
        <input #input4
          class="block w-10 h-[42px] rounded-md bg-white text-center text-gray-900 text-base border border-gray-300 hover:border-gray-400 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-hidden"
          type="text" maxlength="1" formControlName="position4" required
          (input)="onInput($event, input5)">
        <span class="text-2xl mx-1 self-center select-none">-</span>
        <input #input5
          class="block w-10 h-[42px] rounded-md bg-white text-center text-gray-900 text-base border border-gray-300 hover:border-gray-400 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-hidden"
          type="text" maxlength="1" formControlName="position5" required
          (input)="onInput($event, input6)">
        <input #input6
          class="block w-10 h-[42px] rounded-md bg-white text-center text-gray-900 text-base border border-gray-300 hover:border-gray-400 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-hidden"
          type="text" maxlength="1" formControlName="position6" required
          (input)="onInput($event, input7)">
        <input #input7
          class="block w-10 h-[42px] rounded-md bg-white text-center text-gray-900 text-base border border-gray-300 hover:border-gray-400 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-hidden"
          type="text" maxlength="1" formControlName="position7" required
          (input)="onInput($event, input8)">
        <input #input8
          class="block w-10 h-[42px] rounded-md bg-white text-center text-gray-900 text-base border border-gray-300 hover:border-gray-400 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-hidden"
          type="text" maxlength="1" formControlName="position8" required
          (input)="onInput($event, null)">
      </form>
      <div class="flex justify-center">
        <button
          type="submit" form="verification-form"
          class="font-bold h-10 text-sm shadow-lg shadow-indigo-500/40 bg-blue-500 text-white rounded-full px-4 py-2 whitespace-nowrap min-w-[100px] hover:bg-blue-600"
          (click)="confirmVerificationCode()"
        >Validar
        </button>
      </div>
    </div>
  </div>
</div>
