<div class="tw-overflow-auto tw-flex tw-scrollbar-hide tw-w-full tw-justify-between">
  @for (image of cards; track image.src) {
    <div
      [class]="$last ?
        'tw-flex-shrink-0 tw-w-[389px] tw-h-[180px] tw-rounded-[15px] tw-shadow-md tw-relative tw-cursor-pointer' :
        'tw-flex-shrink-0 tw-w-[389px] tw-h-[180px] tw-rounded-[15px] tw-shadow-md tw-mr-2 tw-relative tw-cursor-pointer'"
    >
      <img
        [src]="image.src"
        [alt]="image.alt"
        class="tw-w-full tw-h-full tw-object-cover tw-object-center tw-rounded-lg"
        loading="lazy"
        [attr.fetchpriority]="$index === 0 ? 'high' : 'low'"
      >

      <!-- Capa de opacidad negra con hover -->
      <div class="tw-absolute tw-inset-0 tw-bg-black tw-opacity-0 hover:tw-opacity-50 tw-transition tw-duration-300 tw-ease-in-out tw-rounded-lg">
        <!-- Flecha visible siempre -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
             class="tw-absolute tw-right-4 tw-top-1/2 tw-transform tw--translate-y-1/2 tw-size-6 tw-text-white">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
        </svg>
      </div>
    </div>
  }
</div>
