<div class="w-full py-6 bg-white">
  <div class="max-w-screen-xl mx-auto">
    <div class="w-full overflow-x-auto hide-scrollbar">
      <div class="flex whitespace-nowrap gap-4 md:justify-center cursor-pointer pt-5 pb-8 overflow-visible">
        @for (product of products; track product) {
          <div
            class="flex-none w-[310px] h-[349px] border rounded-lg shadow-md hover:shadow-emerald-500/50 transition flex items-center justify-center hover:overflow-visible hover:scale-105 duration-300"
          >
            <img
              [src]="product.image"
              [alt]="product.alt"
              class="w-full h-full object-contain rounded-md my-1">
          </div>
        }
      </div>
    </div>
    <div class="mt-6 text-center">
              <!-- Botón de unirse -->
        <app-button
          variant="alert"
          size="xl"
          class="md:inline-block hidden"
          [routerLink]="['/auth']"
          [queryParams]="{ ref: 'header', isRegistering: true }"
        >
          ¡Únete ya!
        </app-button>

      <p class="mt-2 text-sm text-beige-700">
        * For illustrative purposes only. Products, partners, and offers may vary & subject to change at any time without notice.
      </p>
    </div>
  </div>
</div>
