<!-- Componente de búsqueda -->
<div class="tw-w-full tw-flex tw-items-center tw-bg-gray-100 tw-rounded-full tw-px-1.5 tw-h-10 hover:tw-bg-gray-200 tw-shadow-sm tw-shadow-indigo-500/40">
  <!-- Icon: Search -->
  <svg
    class="tw-w-6 tw-h-6 tw-text-gray-600"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="1.5"
    stroke="currentColor"
    aria-hidden="true"
  >
    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
  </svg>
  <!-- Input -->
  <input
    type="text"
    [(ngModel)]="searchText"
    (input)="onInput()"
    placeholder="{{ 'menu_header.search.placeholder' | translate }}"
    class="tw-flex-grow tw-bg-transparent tw-border-none tw-outline-none tw-pl-4 tw-text-gray-700 tw-placeholder-gray-400 focus:tw-ring-0 focus:tw-border-transparent"
  />
  <!-- Clear Button (X) -->
  @if (searchText) {
    <button
      (click)="clearSearch()"
      class="tw-flex tw-items-center tw-justify-center tw-bg-gray-700 tw-rounded-full tw-p-2 hover:tw-bg-indigo-950"
    >
      <svg
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="tw-w-2 tw-h-2 tw-text-white"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  }
</div>
