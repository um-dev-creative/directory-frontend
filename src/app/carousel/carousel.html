<div class="relative w-full overflow-hidden group my-5"
     (mouseenter)="pauseAutoplay()"
     (mouseleave)="resumeAutoplay()">
  <!-- Carrusel -->
  <div class="flex transition-transform duration-500 ease-in-out cursor-pointer"
       [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
    @for (slide of slides; track slide.desktop) {
      <div class="shrink-0 w-full pb-2">
        <picture>
          <!-- Desktop -->
          <img
            class="hidden lg:block rounded-[15px] shadow-sm"
            [src]="slide.desktop"
            [alt]="slide.alt"
            (click)="onSlideClick()"
          >
          <!-- Tablet -->
          <img
            class="hidden md:block lg:hidden rounded-[15px] shadow-sm"
            [src]="slide.tablet"
            [alt]="slide.alt"
            (click)="onSlideClick()"
          >
          <!-- Mobile -->
          <img
            class="block md:hidden rounded-[15px] shadow-sm"
            [src]="slide.mobile"
            [alt]="slide.alt"
            (click)="onSlideClick()"
          >
        </picture>
      </div>
    }
  </div>
  <!-- Controles y paginación -->
  <div class="absolute bottom-0 w-full flex justify-center items-center space-x-4 mb-4">
    <div class="flex items-center space-x-3">
      <!-- Botón Anterior -->
      <button
        (click)="prevSlide()"
        class="bg-white/90 p-2 rounded-md shadow-lg hover:bg-white transition-colors duration-200"
        aria-label="Previous slide"
      >
        <svg
          class="w-6 h-6 text-gray-600 hover:text-gray-800 transition-colors"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </svg>
      </button>

      <!-- Paginación -->
      <div class="flex space-x-3">
        @for (slide of slides; track slide; let i = $index) {
          <button
            (click)="goToSlide(i)"
            [class]="'w-3 h-3 rounded-full transition-all duration-300 ' + (currentSlide === i ? 'bg-white scale-110' : 'bg-white/50 hover:bg-white/75')"
            [attr.aria-label]="'Go to slide ' + (i + 1)">
          </button>
        }
      </div>

      <!-- Botón Siguiente -->
      <button
        (click)="nextSlide()"
        class="bg-white/90 p-2 rounded-md shadow-lg hover:bg-white transition-colors duration-200"
        aria-label="Next slide"
      >
        <svg
          class="w-6 h-6 text-gray-600 hover:text-gray-800 transition-colors"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>

      </button>
    </div>
  </div>
</div>
