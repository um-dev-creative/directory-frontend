<div class="relative w-full max-w-[1200px] mx-auto mt-2 pb-12">
  <!-- Sección de Promociones -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
    @for (promoItem of promo?.promotions; track promoItem) {
      <a [href]="promoItem.url" target="_blank" class="block rounded-lg overflow-hidden shadow-lg hover:shadow-xl transition w-full mx-auto">
        <img [src]="imageBucketUrl+promoItem.image" [alt]="promoItem.title" class="w-full max-w-[589px] rounded-lg shadow-md transition hover:scale-105">
      </a>
    }
  </div>
</div>
